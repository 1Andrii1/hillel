<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
   <form class="wrapper">
    <div class="links">
        <a class="log" href="#">Login</a>
        <span class="line">|</span>
        <a class="reg" href="#">Register</a>
    </div>
    <p>Enter your email and password to register</p>
    <div class="data">
        <p>
            <label>
                <input type="text" name="username" placeholder="Username">
            </label>
        </p>
        <p>
            <label>
                <input type="email" name="email" placeholder="Enter your email address">
            </label>
        </p>
        <p>
            <label>
                <input type="password" name="password" placeholder="Password">
            </label>
        </p>
        <p>
            <label>
                <input type="password" name="confirm_password" placeholder="Confirm password">
            </label>
        </p>
    </div>
    <button class="register" type="submit">Register</button>
    <p class="another">Or register with</p>
    <button class="google" type="button">Continue with Google</button>
    <button class="facebook" type="button">Continue with Facebook</button>
</form>
</body>
</html>
